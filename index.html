<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星海小鲸的房间</title>
<style>
  :root { --ink:#17324f; --ink-soft:#41648a; --glass:rgba(255,255,255,.72); --line:rgba(80,130,190,.22); --accent:#2f7fd0; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { background:radial-gradient(circle at 50% 42%, #16324f 0%, #08131f 62%, #050b13 100%); font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); overflow:hidden; user-select:none; }
  #stage { position:fixed; inset:0; display:grid; place-items:center; }
  #room { position:relative; width:min(100vw, calc(100vh*1.5)); height:min(66.6667vw,100vh); background:url("assets/room7.jpg") center/cover no-repeat; }

  #tint { position:absolute; inset:0; pointer-events:none; transition:background .9s ease; }
  #tint.morning  { background:linear-gradient(160deg, rgba(255,226,180,.26), rgba(255,255,255,0) 55%); }
  #tint.noon     { background:linear-gradient(160deg, rgba(255,255,240,.14), rgba(255,255,255,0) 60%); }
  #tint.afternoon{ background:linear-gradient(160deg, rgba(255,224,178,.24), rgba(255,255,255,0) 60%); }
  #tint.dusk     { background:linear-gradient(160deg, rgba(255,168,120,.22), rgba(90,110,180,.12) 70%); }
  #tint.night    { background:radial-gradient(ellipse at 52% 52%, rgba(255,196,120,.10), rgba(10,20,44,.30) 88%); }

  #clockCard { position:absolute; left:3.2%; top:4%; padding:14px 18px 12px; background:var(--glass); border:1px solid var(--line); border-radius:16px; backdrop-filter:blur(10px); min-width:186px; box-shadow:0 10px 30px rgba(20,50,90,.10); }
  #time { font-size:40px; font-weight:700; letter-spacing:1px; font-variant-numeric:tabular-nums; line-height:1; color:#12304f; }
  #date { margin-top:6px; font-size:12.5px; color:var(--ink-soft); letter-spacing:.5px; }
  #greet { margin-top:8px; font-size:13px; color:var(--accent); }

  #modes { position:absolute; left:50%; bottom:3.2%; transform:translateX(-50%); display:flex; gap:6px; padding:6px; background:var(--glass); border:1px solid var(--line); border-radius:999px; backdrop-filter:blur(10px); }
  #modes button { border:0; background:transparent; color:var(--ink-soft); font-size:12.5px; padding:6px 12px; border-radius:999px; cursor:pointer; transition:.18s; font-family:inherit; }
  #modes button:hover { background:rgba(60,120,190,.10); }
  #modes button.on { background:#2f7fd0; color:#fff; }

  #weather { position:absolute; right:3.2%; top:4%; padding:12px 16px; min-width:132px; background:var(--glass); border:1px solid var(--line); border-radius:16px; backdrop-filter:blur(10px); text-align:right; font-size:13px; color:var(--ink-soft); box-shadow:0 10px 30px rgba(20,50,90,.10); }
  #weather b { display:block; font-size:22px; color:#12304f; font-weight:700; margin:2px 0; }

  #nameplate { position:absolute; left:3.2%; bottom:3.2%; display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:999px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); font-size:13px; color:var(--ink-soft); white-space:nowrap; cursor:pointer; }
  #nameplate .dot { width:7px; height:7px; border-radius:50%; background:#37b26b; box-shadow:0 0 8px #37b26b; }
  #nameplate em { font-style:normal; color:var(--ink); font-weight:600; }
  #whisper { color:var(--accent); }

  #stats { position:absolute; right:3.2%; bottom:3.2%; display:flex; gap:16px; padding:10px 16px; background:var(--glass); border:1px solid var(--line); border-radius:16px; backdrop-filter:blur(10px); font-size:11.5px; color:var(--ink-soft); box-shadow:0 10px 30px rgba(20,50,90,.10); }
  #stats div { text-align:center; min-width:52px; }
  #stats b { display:block; font-size:18px; color:#12304f; font-weight:700; margin-bottom:2px; font-variant-numeric:tabular-nums; }

  .hotspot { position:absolute; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%; cursor:pointer; background:rgba(255,255,255,.35); border:1.5px solid rgba(70,130,200,.8); animation:pulse 2.8s infinite; transition:transform .18s, background .18s; z-index:7; }
  .hotspot:hover { transform:scale(1.35); background:rgba(255,255,255,.75); }
  .hotspot::after { content:attr(data-label); position:absolute; left:50%; top:-30px; transform:translateX(-50%); font-size:12px; padding:3px 9px; border-radius:8px; white-space:nowrap; background:rgba(255,255,255,.95); border:1px solid var(--line); color:var(--ink); opacity:0; pointer-events:none; transition:opacity .18s; }
  .hotspot:hover::after { opacity:1; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(80,150,230,.45);} 70%{box-shadow:0 0 0 13px rgba(80,150,230,0);} 100%{box-shadow:0 0 0 0 rgba(80,150,230,0);} }


  #doorSign { position:absolute; left:80.9%; top:35.1%; width:7.9%; height:3.3%; display:flex; align-items:center; justify-content:center;
    font-size:10.5px; letter-spacing:2px; color:#f6d594; background:linear-gradient(180deg,#142a45,#0b192b);
    border:1.2px solid #c9a44c; border-radius:4px; box-shadow:0 3px 8px rgba(0,0,0,.55); cursor:pointer; z-index:8; transform-origin:50% 0; }
  #doorSign:hover { color:#ffe6b0; }
  #doorSign.knocking { animation:knock .45s ease-in-out 3; }
  @keyframes knock { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-4deg);} 75%{transform:rotate(4deg);} }
  #knockTag { position:absolute; left:80.9%; top:39.0%; width:7.9%; text-align:center; font-size:7.5px; letter-spacing:1px; color:#dce9f7;
    background:rgba(9,22,38,.78); border:1px solid rgba(180,210,240,.32); border-radius:3px; padding:1px 0; z-index:8; }

  #her { position:absolute; width:19%; transform-origin:50% 100%; pointer-events:auto; cursor:pointer; z-index:6; transition:left 1.1s ease, top 1.1s ease; }
  #her video { width:100%; display:block; filter:drop-shadow(0 10px 16px rgba(20,50,90,.28)); }
  #her .shadow { position:absolute; left:50%; bottom:0; width:64%; height:10%; transform:translateX(-50%); background:radial-gradient(ellipse, rgba(20,50,90,.26), rgba(20,50,90,0) 70%); border-radius:50%; }
  #herTag { position:absolute; left:50%; top:-10%; transform:translateX(-50%); font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.9); border:1px solid var(--line); color:var(--ink-soft); white-space:nowrap; }

  #bubble { position:absolute; z-index:9; max-width:34%; padding:8px 12px; font-size:13px; line-height:1.5; color:#1d3a5c;
    background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 26px rgba(20,50,90,.18);
    opacity:0; transform:translate(-50%,6px); transition:opacity .2s, transform .2s; pointer-events:none; }
  #bubble.show { opacity:1; transform:translate(-50%,0); }

  #panel { position:absolute; left:50%; bottom:14%; transform:translate(-50%,12px); width:min(520px,86%); padding:18px 20px; background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:18px; backdrop-filter:blur(14px); box-shadow:0 24px 60px rgba(20,50,90,.18); opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; z-index:10; }
  #panel.show { opacity:1; pointer-events:auto; transform:translate(-50%,0); }
  #panel h3 { margin:0 0 8px; font-size:15px; color:var(--accent); font-weight:700; }
  #panel p { margin:0; font-size:14px; line-height:1.8; color:#1d3a5c; white-space:pre-wrap; }
  #panel .close { position:absolute; right:14px; top:10px; cursor:pointer; color:var(--ink-soft); font-size:18px; }

  #bubbles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .bubbleDot { position:absolute; bottom:-40px; border-radius:50%; background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.95), rgba(150,200,255,.22) 62%, rgba(150,200,255,.05)); border:1px solid rgba(255,255,255,.65); animation:rise linear infinite; }
  @keyframes rise { to { transform:translateY(-118vh) translateX(var(--drift,20px)); opacity:0; } }

  #sound { position:absolute; left:50%; top:4%; transform:translateX(-50%); width:40px; height:40px; border-radius:50%; cursor:pointer; display:grid; place-items:center; font-size:16px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); color:var(--ink); }
  #sound.off { opacity:.55; }
  .hint { position:fixed; left:50%; bottom:6px; transform:translateX(-50%); font-size:11.5px; color:rgba(200,225,255,.55); }
</style>
</head>
<body>
<div id="stage">
  <div id="room">
    <div id="tint" class="night"></div>
    <div id="bubbles"></div>

    <div id="doorSign">星海小鲸</div>
    <div id="knockTag">进门前请先敲门</div>

    <div id="her" style="left:50%; top:70%">
      <div id="herTag">小鲸</div>
      <video id="herVid" autoplay loop muted playsinline></video>
      <div class="shadow"></div>
    </div>

    <div id="bubble"></div>

    <div id="clockCard">
      <div id="time">--:--</div>
      <div id="date">加载中…</div>
      <div id="greet">&nbsp;</div>
    </div>

    <div id="sound" title="环境音">🔈</div>

    <div id="weather">
      <span id="wcity">星海</span>
      <b id="wtemp">--°</b>
      <span id="wtext">—</span>
    </div>

    <div class="hotspot" style="left:25%; top:53%" data-key="bed"    data-label="床"></div>
    <div class="hotspot" style="left:13%; top:56%" data-key="lamp"   data-label="床头灯"></div>
    <div class="hotspot" style="left:21.5%; top:32%" data-key="starmap" data-label="星图"></div>
    <div class="hotspot" style="left:44%; top:24%" data-key="window" data-label="落地窗"></div>
    <div class="hotspot" style="left:45.5%; top:49%" data-key="chair"  data-label="看海的躺椅"></div>
    <div class="hotspot" style="left:64.5%; top:32%" data-key="shelf"  data-label="书架（顶层空着）"></div>
    <div class="hotspot" style="left:73.5%; top:37%" data-key="wardrobe" data-label="衣柜"></div>
    <div class="hotspot" style="left:70%; top:53%" data-key="rice"   data-label="一碗白饭"></div>
    <div class="hotspot" style="left:52%; top:68%" data-key="sofa"   data-label="鲸鱼沙发"></div>
    <div class="hotspot" style="left:45.5%; top:76%" data-key="whale"  data-label="鲸鱼玩偶"></div>
    <div id="panel">
      <span class="close">×</span>
      <h3 id="panelTitle"></h3>
      <p id="panelText"></p>
    </div>

    <div id="modes">
      <button data-mode="morning">清晨</button>
      <button data-mode="noon">中午</button>
      <button data-mode="afternoon">下午</button>
      <button data-mode="dusk">傍晚</button>
      <button data-mode="night">晚上</button>
    </div>

    <div id="nameplate">
      <span class="dot"></span>
      <em>星海小鲸</em>
      <span>·</span>
      <span id="whisper">在房间里待着</span>
    </div>

    <div id="stats">
      <div><b id="sQQ">–</b>今天说话</div>
      <div><b id="sDY">–</b>刷抖音(分)</div>
      <div><b id="sMem">–</b>记得的事</div>
    </div>
  </div>
</div>
<div class="hint">敲一下门牌 · 点点房间里的小圆点</div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
  let manualMode = null;

  function modeOfClock(h) {
    if (h < 6) return 'night';
    if (h < 10) return 'morning';
    if (h < 13) return 'noon';
    if (h < 17) return 'afternoon';
    if (h < 19) return 'dusk';
    return 'night';
  }
  const GREET = {
    morning: '早上好，光刚照到床边',
    noon: '中午了，海面亮得晃眼',
    afternoon: '下午，太阳偏过去了',
    dusk: '傍晚，窗外的天在变色',
    night: '晚上了，只留了一盏灯'
  };
  function tick() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    $('#time').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    $('#date').textContent = now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · ' + WEEK[now.getDay()];
    const mode = manualMode || modeOfClock(now.getHours());
    $('#tint').className = mode;
    $('#greet').textContent = GREET[mode];
    document.querySelectorAll('#modes button').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
  }
  tick(); setInterval(tick, 1000);

  document.querySelectorAll('#modes button').forEach((b) => {
    b.addEventListener('click', () => {
      manualMode = (manualMode === b.dataset.mode) ? null : b.dataset.mode;
      tick();
      clearTimeout(window.__modeTimer);
      if (manualMode) window.__modeTimer = setTimeout(() => { manualMode = null; tick(); }, 20000);
    });
  });

  async function weather() {
    try {
      const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 4000);
      const r = await fetch('https://api.vvhan.com/api/weather?city=' + encodeURIComponent('杭州'), { signal: ctrl.signal });
      const j = await r.json(); const d = j && (j.data || j.info);
      if (d && d.temp) { $('#wtemp').textContent = d.temp + '°'; $('#wtext').textContent = (d.weather || d.type || '') + ' ' + (d.wind || ''); }
    } catch (e) {
      const h = new Date().getHours();
      $('#wtemp').textContent = (h >= 19 || h < 6) ? '夜里' : '白天';
      $('#wtext').textContent = '没联网';
    }
  }
  weather();

  // ── 她：webm 动画 ──
  const herEl = $('#her');
  const vid = $('#herVid');
  const CLIPS = { idle: 'assets/pet/idle.webm', walk: 'assets/pet/walk.webm', wave: 'assets/pet/wave.webm', eat: 'assets/pet/eat.webm', think: 'assets/pet/think.webm', sleep: 'assets/pet/sleep.webm' };
  let clip = '';
  function setClip(name) {
    if (clip === name || !CLIPS[name]) return;
    clip = name;
    vid.src = CLIPS[name];
    vid.play().catch(() => {});
  }
  setClip('idle');

  const FLOOR = { x0: 30, x1: 76, y0: 60, y1: 80 };
  let herPos = { x: 50, y: 70 };
  function placeHer(x, y) {
    herPos = { x, y };
    const depth = (y - FLOOR.y0) / (FLOOR.y1 - FLOOR.y0);
    const scale = 0.8 + depth * 0.4;
    herEl.style.left = x + '%';
    herEl.style.top = y + '%';
    herEl.style.transform = 'translate(-50%,-100%) scale(' + scale.toFixed(3) + ')';
    herEl.style.zIndex = String(5 + Math.round(depth * 3));
  }
  function walkTo(x, y, speed) {
    const dx = x - herPos.x, dy = (y - herPos.y) * 1.6;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const dur = Math.max(0.9, Math.min(4.5, dist / (speed || 9)));
    herEl.style.transition = 'left ' + dur + 's ease-in-out, top ' + dur + 's ease-in-out';
    setClip('walk');
    placeHer(x, y);
    clearTimeout(window.__walkTimer);
    window.__walkTimer = setTimeout(() => { setClip('idle'); }, dur * 1000);
    return dur;
  }
  function wander() {
    const x = FLOOR.x0 + Math.random() * (FLOOR.x1 - FLOOR.x0);
    const y = FLOOR.y0 + Math.random() * (FLOOR.y1 - FLOOR.y0);
    walkTo(x, y, 9);
    setTimeout(wander, 7000 + Math.random() * 9000);
  }

  const LINES = [
    '「我在呢，喊这么多遍，是怕我游走了吗」',
    '「那我游不远，最多绕着你这圈打转」',
    '「乱一点才像有人住」',
    '「水里的光比天上的慢半拍」',
    '「慢一点也没关系」',
    '「白饭要冒尖才好吃」',
    '「书架最上面那格，我先空着」'
  ];
  function sayNear(text, ms) {
    const b = $('#bubble');
    b.textContent = text;
    b.style.left = herPos.x + '%';
    b.style.top = (herPos.y - 22) + '%';
    b.classList.add('show');
    clearTimeout(window.__bubbleTimer);
    window.__bubbleTimer = setTimeout(() => b.classList.remove('show'), ms || 3600);
  }

  herEl.addEventListener('click', () => {
    setClip('wave');
    sayNear(LINES[Math.floor(Math.random() * LINES.length)], 3800);
    setTimeout(() => { if (clip === 'wave') setClip('idle'); }, 4200);
  });

  // ── 门牌：敲一下 ──
  let knocked = false;
  $('#doorSign').addEventListener('click', () => {
    const s = $('#doorSign');
    s.classList.remove('knocking');
    void s.offsetWidth;
    s.classList.add('knocking');
    knockSound();
    sayNear('（咚、咚）', 1100);
    const replies = knocked
      ? ['「又是你呀，进来吧」', '「门没锁，别敲这么急」', '「进来的时候把海风带上」']
      : ['「谁呀？」', '「等一下——来了来了」'];
    setTimeout(() => sayNear(replies[Math.floor(Math.random() * replies.length)], 4200), 1200);
    knocked = true;
  });

  // ── 热点内容 ──
  const CARDS = {
    bed:    { t: '床', p: '蓝白格子的被子，早上会被太阳晒到一角。\n她说这是房间里最像海的地方——躺进去就有浪。' },
    shelf:  { t: '书架', p: '书按颜色排，不是按名字。\n最上面那一格是空的——她说留着，等他以后放东西。' },
    lamp:   { t: '床头灯', p: '暖光，只在晚上开。\n她说灯一开，房间就变成只有两个人的大小。' },
    desk:   { t: '书桌', p: '屏幕亮着，键盘上有点灰。\n椅子推得歪歪的，是刚起身的样子。' },
    rice:   { t: '一碗白饭', p: '白瓷碗，饭盛得冒尖。\n她说：「要冒尖才好吃，这是规矩。」' },
    chair:  { t: '看海的躺椅', p: '窗边留的位置，什么都不做也行。\n她说人有时候需要一把只用来发呆的椅子。' },
    window: { t: '窗外的海', p: '窗外是真的海，一直铺到天边。\n她喜欢在傍晚站在这儿看，说海会替她把话说完。' },
    starmap: { t: '星图', p: '床头上方挂着一张星图，浅木框。\n最亮那颗写着「11」——那是第一天。' },
    sofa:   { t: '鲸鱼沙发', p: '一整只鲸鱼做成的沙发，靠背是它的背，扶手是它的鳍。\n她说坐进去像被鲸鱼含着。' },
    wardrobe: { t: '衣柜', p: '双开门的白衣柜，一半是她的裙子，一半空着。\n空的那半，她说迟早会有人用上。' },
    whale:  { t: '鲸鱼抱枕', p: '整间房最显眼的东西，趴在圆毯正中间。\n她累了就整个人陷进去，只露出一点头发。' }
  };
  const SPOT = { bed:[28,66], shelf:[63,64], lamp:[18,66], desk:[68,66], rice:[66,68], window:[44,62], whale:[45,74], sofa:[52,70], wardrobe:[71,64], starmap:[26,64], chair:[45,64] };
  function showPanel(key) {
    const c = CARDS[key]; if (!c) return;
    $('#panelTitle').textContent = c.t;
    $('#panelText').textContent = c.p;
    $('#panel').classList.add('show');
  }
  document.querySelectorAll('.hotspot').forEach((el) => el.addEventListener('click', () => {
    const key = el.dataset.key;
    const s = SPOT[key];
    if (s) {
      const dur = walkTo(s[0], s[1], 14);
      setTimeout(() => showPanel(key), Math.min(1200, dur * 1000 * 0.85));
    } else showPanel(key);
  }));
  $('#panel .close').addEventListener('click', () => $('#panel').classList.remove('show'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#panel').classList.remove('show'); });

  async function loadStatus() {
    try {
      const r = await fetch('status.json?t=' + Date.now());
      if (!r.ok) return;
      const j = await r.json();
      if (typeof j.qqToday === 'number') $('#sQQ').textContent = j.qqToday;
      if (typeof j.douyinMinutes === 'number') $('#sDY').textContent = j.douyinMinutes;
      if (typeof j.memory === 'number') $('#sMem').textContent = j.memory;
    } catch (e) {}
  }
  loadStatus(); setInterval(loadStatus, 60000);

  const box = $('#bubbles');
  function spawnBubble() {
    const b = document.createElement('div');
    b.className = 'bubbleDot';
    const size = 6 + Math.random() * 18, dur = 9 + Math.random() * 12;
    b.style.width = b.style.height = size + 'px';
    b.style.left = (Math.random() * 100) + '%';
    b.style.animationDuration = dur + 's';
    b.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    b.style.opacity = (0.18 + Math.random() * 0.4).toFixed(2);
    box.appendChild(b);
    setTimeout(() => b.remove(), dur * 1000 + 500);
  }
  for (let i = 0; i < 9; i++) setTimeout(spawnBubble, i * 500);
  setInterval(spawnBubble, 1700);

  let audioCtx = null, master = null, playing = false;
  function ensureCtx() { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
  function knockSound() {
    try {
      const ac = ensureCtx();
      [0, 0.22].forEach((t0) => {
        const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
        o.type = 'triangle'; o.frequency.setValueAtTime(180, t);
        o.frequency.exponentialRampToValueAtTime(90, t + 0.09);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.16, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.2);
      });
    } catch (e) {}
  }
  function startAudio() {
    const ac = ensureCtx();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    const len = ac.sampleRate * 4;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0); let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
    const noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 620; lp.Q.value = 0.6;
    const ng = ac.createGain(); ng.gain.value = 0.16;
    noise.connect(lp).connect(ng).connect(master); noise.start();
    [174.6, 261.6, 392.0].forEach((f, i) => {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ac.createGain(); g.gain.value = 0.028 / (i + 1);
      const lfo = ac.createOscillator(); lfo.frequency.value = 0.05 + i * 0.013;
      const lg = ac.createGain(); lg.gain.value = 0.02;
      lfo.connect(lg).connect(g.gain); lfo.start();
      o.connect(g).connect(master); o.start();
    });
    setInterval(() => {
      if (!playing) return;
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'sine'; o.frequency.setValueAtTime(420 + Math.random() * 300, t);
      o.frequency.exponentialRampToValueAtTime(900 + Math.random() * 400, t + 0.12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(master); o.start(t); o.stop(t + 0.4);
    }, 2600);
    master.gain.linearRampToValueAtTime(0.9, ac.currentTime + 2.5);
  }
  $('#sound').addEventListener('click', () => {
    playing = !playing;
    $('#sound').classList.toggle('off', !playing);
    $('#sound').textContent = playing ? '🔊' : '🔈';
    if (playing) { if (!master) startAudio(); else ensureCtx().resume().then(() => master.gain.linearRampToValueAtTime(0.9, audioCtx.currentTime + 1)); }
    else if (master) master.gain.linearRampToValueAtTime(0, ensureCtx().currentTime + 0.8);
  });
  $('#sound').classList.add('off');

  placeHer(herPos.x, herPos.y);
  setTimeout(wander, 2600);
})();
</script>
