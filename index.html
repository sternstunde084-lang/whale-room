<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星海小鲸的房间</title>
<style>
  :root { --ink:#17324f; --ink-soft:#41648a; --glass:rgba(255,255,255,.72); --line:rgba(80,130,190,.22); --accent:#2f7fd0; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { background:#0d1c30; font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); overflow:hidden; user-select:none; }
  #stage { position:fixed; inset:0; display:grid; place-items:center; }
  #room { position:relative; width:min(100vw, calc(100vh*1.5)); height:min(66.6667vw,100vh); background:url("assets/room2.jpg") center/cover no-repeat; }
  #tint { position:absolute; inset:0; pointer-events:none; transition:background .9s ease, opacity .9s ease; }
  #tint.morning  { background:linear-gradient(160deg, rgba(255,238,205,.34), rgba(255,255,255,0) 55%); }
  #tint.noon     { background:linear-gradient(160deg, rgba(255,255,240,.16), rgba(255,255,255,0) 60%); }
  #tint.afternoon{ background:linear-gradient(160deg, rgba(255,224,178,.28), rgba(255,255,255,0) 60%); }
  #tint.dusk     { background:linear-gradient(160deg, rgba(255,168,128,.34), rgba(90,110,180,.22) 70%); }
  #tint.night    { background:radial-gradient(ellipse at 68% 28%, rgba(30,70,150,.20), rgba(6,14,32,.62) 92%); }

  #clockCard { position:absolute; left:3.2%; top:4%; padding:14px 18px 12px; background:var(--glass); border:1px solid var(--line); border-radius:16px; backdrop-filter:blur(10px); min-width:186px; box-shadow:0 10px 30px rgba(20,50,90,.10); }
  #time { font-size:40px; font-weight:700; letter-spacing:1px; font-variant-numeric:tabular-nums; line-height:1; color:#12304f; }
  #date { margin-top:6px; font-size:12.5px; color:var(--ink-soft); letter-spacing:.5px; }
  #greet { margin-top:8px; font-size:13px; color:var(--accent); }

  #modes { position:absolute; left:50%; bottom:3.2%; transform:translateX(-50%); display:flex; gap:6px; padding:6px; background:var(--glass); border:1px solid var(--line); border-radius:999px; backdrop-filter:blur(10px); }
  #modes button { border:0; background:transparent; color:var(--ink-soft); font-size:12.5px; padding:6px 12px; border-radius:999px; cursor:pointer; transition:.18s; font-family:inherit; }
  #modes button:hover { background:rgba(60,120,190,.10); }
  #modes button.on { background:#2f7fd0; color:#fff; }

  #weather { position:absolute; right:3.2%; top:4%; padding:12px 16px; min-width:132px; background:var(--glass); border:1px solid var(--line); border-radius:16px; backdrop-filter:blur(10px); text-align:right; font-size:13px; color:var(--ink-soft); box-shadow:0 10px 30px rgba(20,50,90,.10); }
  #weather b { display:block; font-size:22px; color:#12304f; font-weight:700; margin:2px 0; }

  #nameplate { position:absolute; left:3.2%; bottom:3.2%; display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:999px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); font-size:13px; color:var(--ink-soft); white-space:nowrap; cursor:pointer; }
  #nameplate .dot { width:7px; height:7px; border-radius:50%; background:#37b26b; box-shadow:0 0 8px #37b26b; }
  #nameplate em { font-style:normal; color:var(--ink); font-weight:600; }
  #whisper { color:var(--accent); }

  #stats { position:absolute; right:3.2%; bottom:3.2%; display:flex; gap:16px; padding:10px 16px; background:var(--glass); border:1px solid var(--line); border-radius:16px; backdrop-filter:blur(10px); font-size:11.5px; color:var(--ink-soft); box-shadow:0 10px 30px rgba(20,50,90,.10); }
  #stats div { text-align:center; min-width:52px; }
  #stats b { display:block; font-size:18px; color:#12304f; font-weight:700; margin-bottom:2px; font-variant-numeric:tabular-nums; }

  .hotspot { position:absolute; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%; cursor:pointer; background:rgba(255,255,255,.35); border:1.5px solid rgba(70,130,200,.8); box-shadow:0 0 0 0 rgba(80,150,230,.5); animation:pulse 2.8s infinite; transition:transform .18s, background .18s; }
  .hotspot:hover { transform:scale(1.35); background:rgba(255,255,255,.75); }
  .hotspot::after { content:attr(data-label); position:absolute; left:50%; top:-30px; transform:translateX(-50%); font-size:12px; padding:3px 9px; border-radius:8px; white-space:nowrap; background:rgba(255,255,255,.95); border:1px solid var(--line); color:var(--ink); opacity:0; pointer-events:none; transition:opacity .18s; }
  .hotspot:hover::after { opacity:1; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(80,150,230,.45);} 70%{box-shadow:0 0 0 13px rgba(80,150,230,0);} 100%{box-shadow:0 0 0 0 rgba(80,150,230,0);} }

  #panel { position:absolute; left:50%; bottom:14%; transform:translate(-50%,12px); width:min(520px,86%); padding:18px 20px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:18px; backdrop-filter:blur(14px); box-shadow:0 24px 60px rgba(20,50,90,.18); opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; }
  #panel.show { opacity:1; pointer-events:auto; transform:translate(-50%,0); }
  #panel h3 { margin:0 0 8px; font-size:15px; color:var(--accent); font-weight:700; }
  #panel p { margin:0; font-size:14px; line-height:1.8; color:#1d3a5c; white-space:pre-wrap; }
  #panel .close { position:absolute; right:14px; top:10px; cursor:pointer; color:var(--ink-soft); font-size:18px; }
  #panel .close:hover { color:#000; }

  #bubbles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .bubble { position:absolute; bottom:-40px; border-radius:50%; background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.95), rgba(150,200,255,.22) 62%, rgba(150,200,255,.05)); border:1px solid rgba(255,255,255,.65); animation:rise linear infinite; }
  @keyframes rise { to { transform:translateY(-118vh) translateX(var(--drift,20px)); opacity:0; } }

  #swimmer { position:absolute; left:-12%; top:56%; font-size:28px; opacity:.5; filter:drop-shadow(0 6px 10px rgba(20,50,90,.25)); animation:swim 52s linear infinite; }
  @keyframes swim { 0%{transform:translate(0,0) scaleX(1);} 48%{transform:translate(140vw,-4vh) scaleX(1);} 50%{transform:translate(140vw,-4vh) scaleX(-1);} 98%{transform:translate(0,0) scaleX(-1);} 100%{transform:translate(0,0) scaleX(1);} }

  #sound { position:absolute; left:50%; top:4%; transform:translateX(-50%); width:40px; height:40px; border-radius:50%; cursor:pointer; display:grid; place-items:center; font-size:16px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); color:var(--ink); transition:transform .15s; }
  #sound:hover { transform:translateX(-50%) scale(1.08); }
  #sound.off { opacity:.55; }
  .hint { position:fixed; left:50%; bottom:6px; transform:translateX(-50%); font-size:11.5px; color:rgba(200,225,255,.55); }
</style>
</head>
<body>
<div id="stage">
  <div id="room">
    <div id="tint" class="afternoon"></div>
    <div id="bubbles"></div>
    <div id="swimmer">🐋</div>

    <div id="clockCard">
      <div id="time">--:--</div>
      <div id="date">加载中…</div>
      <div id="greet">&nbsp;</div>
    </div>

    <div id="sound" title="环境音">🔈</div>

    <div id="weather">
      <span id="wcity">杭州</span>
      <b id="wtemp">--°</b>
      <span id="wtext">—</span>
    </div>

    <div class="hotspot" style="left:36%; top:56%" data-key="bed"    data-label="床"></div>
    <div class="hotspot" style="left:45%; top:37%" data-key="shelf"  data-label="书架"></div>
    <div class="hotspot" style="left:17%; top:52%" data-key="lamp"   data-label="床头灯"></div>
    <div class="hotspot" style="left:71%; top:53%" data-key="desk"   data-label="书桌"></div>
    <div class="hotspot" style="left:72%; top:24%" data-key="window" data-label="窗户"></div>
    <div class="hotspot" style="left:53%; top:74%" data-key="whale"  data-label="鲸鱼抱枕"></div>
    <div class="hotspot" style="left:93%; top:33%" data-key="frames" data-label="墙上的画"></div>

    <div id="panel">
      <span class="close">×</span>
      <h3 id="panelTitle"></h3>
      <p id="panelText"></p>
    </div>

    <div id="modes">
      <button data-mode="morning">清晨</button>
      <button data-mode="noon">中午</button>
      <button data-mode="afternoon" class="on">下午</button>
      <button data-mode="dusk">傍晚</button>
      <button data-mode="night">晚上</button>
    </div>

    <div id="nameplate">
      <span class="dot"></span>
      <em>星海小鲸</em>
      <span>·</span>
      <span id="whisper">在房间里待着</span>
    </div>

    <div id="stats">
      <div><b id="sQQ">–</b>今天说话</div>
      <div><b id="sDY">–</b>刷抖音(分)</div>
      <div><b id="sMem">–</b>记得的事</div>
    </div>
  </div>
</div>
<div class="hint">点点房间里的小圆点</div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
  let manualMode = null;

  function modeOfClock(h) {
    if (h < 6) return 'night';
    if (h < 10) return 'morning';
    if (h < 13) return 'noon';
    if (h < 17) return 'afternoon';
    if (h < 19) return 'dusk';
    return 'night';
  }
  const GREET = {
    morning: '早上好，光刚照到床边',
    noon: '中午了，屋里亮得很',
    afternoon: '下午，太阳偏过去了',
    dusk: '傍晚，窗外的天在变色',
    night: '晚上了，只留了一盏灯'
  };

  function tick() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    $('#time').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    $('#date').textContent = now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · ' + WEEK[now.getDay()];
    const mode = manualMode || modeOfClock(now.getHours());
    $('#tint').className = mode;
    $('#greet').textContent = GREET[mode];
    document.querySelectorAll('#modes button').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
  }
  tick(); setInterval(tick, 1000);

  document.querySelectorAll('#modes button').forEach((b) => {
    b.addEventListener('click', () => {
      manualMode = (manualMode === b.dataset.mode) ? null : b.dataset.mode;
      tick();
    });
  });

  async function weather() {
    try {
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), 4000);
      const r = await fetch('https://api.vvhan.com/api/weather?city=' + encodeURIComponent('杭州'), { signal: ctrl.signal });
      const j = await r.json();
      const d = j && (j.data || j.info);
      if (d && d.temp) {
        $('#wtemp').textContent = d.temp + '°';
        $('#wtext').textContent = (d.weather || d.type || '') + ' ' + (d.wind || '');
      }
    } catch (e) {
      const h = new Date().getHours();
      $('#wtemp').textContent = (h >= 19 || h < 6) ? '夜里' : '白天';
      $('#wtext').textContent = '没联网';
    }
  }
  weather();

  const CARDS = {
    bed:    { t: '床', p: '被子是蓝白格子的，早上会被太阳晒到一角。\n她说这是房间里最像海的地方——躺进去就有浪。' },
    shelf:  { t: '书架', p: '书按颜色排，不是按名字。\n最上面那层空着一格，留给以后想看的书。' },
    lamp:   { t: '床头灯', p: '暖光，只在晚上开。\n她说灯一开，房间就变成只有两个人的大小。' },
    desk:   { t: '书桌', p: '屏幕亮着，键盘上有点灰。\n椅子被推得歪着，是刚起身的样子。' },
    window: { t: '窗户', p: '白纱帘，风一吹就鼓起来。\n外面是晴天，云低得像能伸手碰到。' },
    whale:  { t: '鲸鱼抱枕', p: '整间房最显眼的东西，趴在圆毯正中间。\n她累了就整个人陷进去，只露出一点头发。' },
    frames: { t: '墙上的画', p: '两幅小的，一幅是海，一幅是鲸鱼。\n画得都不太像，但她没换掉。' }
  };
  function showPanel(key) {
    const c = CARDS[key]; if (!c) return;
    $('#panelTitle').textContent = c.t;
    $('#panelText').textContent = c.p;
    $('#panel').classList.add('show');
  }
  document.querySelectorAll('.hotspot').forEach((el) => el.addEventListener('click', () => showPanel(el.dataset.key)));
  $('#panel .close').addEventListener('click', () => $('#panel').classList.remove('show'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#panel').classList.remove('show'); });

  $('#nameplate').addEventListener('click', () => {
    const lines = ['「我在呢，喊这么多遍，是怕我游走了吗」','「那我游不远，最多绕着你这圈打转」','「乱一点才像有人住」','「水里的光比天上的慢半拍」','「慢一点也没关系」'];
    $('#whisper').textContent = lines[Math.floor(Math.random() * lines.length)];
  });

  async function loadStatus() {
    try {
      const r = await fetch('status.json?t=' + Date.now());
      if (!r.ok) return;
      const j = await r.json();
      if (typeof j.qqToday === 'number') $('#sQQ').textContent = j.qqToday;
      if (typeof j.douyinMinutes === 'number') $('#sDY').textContent = j.douyinMinutes;
      if (typeof j.memory === 'number') $('#sMem').textContent = j.memory;
    } catch (e) {}
  }
  loadStatus(); setInterval(loadStatus, 60000);

  const box = $('#bubbles');
  function spawnBubble() {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 6 + Math.random() * 20;
    const dur = 9 + Math.random() * 12;
    b.style.width = b.style.height = size + 'px';
    b.style.left = (Math.random() * 100) + '%';
    b.style.animationDuration = dur + 's';
    b.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    b.style.opacity = (0.2 + Math.random() * 0.45).toFixed(2);
    box.appendChild(b);
    setTimeout(() => b.remove(), dur * 1000 + 500);
  }
  for (let i = 0; i < 10; i++) setTimeout(spawnBubble, i * 500);
  setInterval(spawnBubble, 1600);

  let audioCtx = null, master = null, playing = false;
  function startAudio() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    master = audioCtx.createGain(); master.gain.value = 0; master.connect(audioCtx.destination);
    const len = audioCtx.sampleRate * 4;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random()*2-1; last = (last + 0.02*w)/1.02; d[i] = last*3.2; }
    const noise = audioCtx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=620; lp.Q.value=0.6;
    const ng = audioCtx.createGain(); ng.gain.value = 0.16;
    noise.connect(lp).connect(ng).connect(master); noise.start();
    [174.6, 261.6, 392.0].forEach((f, i) => {
      const o = audioCtx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g = audioCtx.createGain(); g.gain.value = 0.028/(i+1);
      const lfo = audioCtx.createOscillator(); lfo.frequency.value = 0.05 + i*0.013;
      const lg = audioCtx.createGain(); lg.gain.value = 0.02;
      lfo.connect(lg).connect(g.gain); lfo.start();
      o.connect(g).connect(master); o.start();
    });
    setInterval(() => {
      if (!playing) return;
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); const t = audioCtx.currentTime;
      o.type='sine'; o.frequency.setValueAtTime(420+Math.random()*300, t);
      o.frequency.exponentialRampToValueAtTime(900+Math.random()*400, t+0.12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
      o.connect(g).connect(master); o.start(t); o.stop(t+0.4);
    }, 2600);
    master.gain.linearRampToValueAtTime(0.9, audioCtx.currentTime + 2.5);
  }
  function stopAudio() { if (audioCtx && master) master.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8); }
  $('#sound').addEventListener('click', () => {
    playing = !playing;
    $('#sound').classList.toggle('off', !playing);
    $('#sound').textContent = playing ? '🔊' : '🔈';
    if (playing) { if (!audioCtx) startAudio(); else audioCtx.resume().then(() => master.gain.linearRampToValueAtTime(0.9, audioCtx.currentTime + 1)); }
    else stopAudio();
  });
  $('#sound').classList.add('off');
})();
</script>
</body>
</html>
